font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# Catppuccin Mocha
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #1E1E2E

url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

color0  #45475A
color1  #F38BA8
color2  #A6E3A1
color3  #F9E2AF
color4  #89B4FA
color5  #F5C2E7
color6  #94E2D5
color7  #BAC2DE
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8

background_opacity      0.92
window_padding_width    12
confirm_os_window_close 0

# Control remoto para menú contextual
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Ctrl+C copia si hay texto seleccionado, si no envía interrupción
map ctrl+c copy_or_interrupt
# Ctrl+V pega del portapapeles
map ctrl+v paste_from_clipboard

# Clic derecho abre menú contextual (copiar/pegar/recortar)
mouse_map right press ungrabbed launch --type=background bash /home/pikson/.config/kitty/context_menu.sh

enable_audio_bell       no
cursor_blink_interval   0

tab_bar_style           powerline
tab_powerline_style     slanted
