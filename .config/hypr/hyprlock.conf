general {
    screencopy_mode = 1
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/pikson/.config/quickshell/wallpaper.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    color = rgba(246, 235, 207, 1.0)
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d / %m / %Y"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(208, 185, 146, 1.0)
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(226, 181, 100, 1.0)
    inner_color = rgba(74, 56, 42, 0.94)
    font_color = rgba(246, 235, 207, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(173, 199, 131, 1.0)
    fail_color = rgba(207, 123, 85, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    fail_text = <i>Incorrecta</i>
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(208, 185, 146, 1.0)
    position = 0, -90
    halign = center
    valign = center
}
