################
### MONITORES ###
################
# AOC 24G2WG3 - Principal (centro abajo)
monitor = DP-1, 1920x1080@165, 540x1080, 1
# Samsung S27C31x - Secundario (arriba, alineado con AOC)
monitor = HDMI-A-1, 1920x1080@60, 540x0, 1
# LG Full HD - Terciario (derecha del Samsung, vertical invertido)
monitor = DP-2, 1920x1080@75, 2460x270, 1, transform, 3
# Fallback para monitores adicionales
monitor=,preferred,auto,1

####################
### WORKSPACES ###
####################
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-2, default:true

################
### IDIOMA ###
################
env = LANG,es_ES.UTF-8
env = LC_ALL,es_ES.UTF-8

#################
### NVIDIA ENV ###
#################
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = MOZ_ENABLE_WAYLAND,1

env = XCURSOR_THEME,default
env = XCURSOR_SIZE,24

cursor {
    no_hardware_cursors = true
}

###############
### AUTOSTART ###
###############
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprctl setcursor default 24
exec-once = xrdb ~/.Xresources
exec-once = python3 ~/.config/hypr/scripts/bomboclat.py
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = hypridle
exec-once = streamdeck
exec-once = nwg-dock-hyprland -p right -o DP-1 -i 24 -a start -f -mt 8 -mb 536 -mr 8 -nolauncher
exec-once = nm-applet --indicator

#################
### APARIENCIA ###
#################
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a2e99)
    }
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, smoothIn, slide
    animation = border, 1, 10, default
    animation = fade, 1, 10, smoothIn
    animation = fadeDim, 1, 10, smoothOut
    animation = workspaces, 1, 6, overshot, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

debug {
    disable_logs = false
}

################
### TECLADO ###
################
input {
    kb_layout = es
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gestures {
}

####################
### ATAJOS (SUPER) ###
####################
$mod = SUPER

# Aplicaciones
bind = $mod, Return, exec, kitty
bind = $mod, C, exec, kitty -e claude
bind = $mod, S, exec, flatpak run com.spotify.Client
bind = $mod SHIFT, S, exec, steam
bind = $mod, D, exec, discord
bind = $mod, B, exec, brave
bind = $mod, W, exec, brave https://web.whatsapp.com
bind = $mod, V, exec, code
bind = $mod, E, exec, nautilus
bind = $mod, Space, exec, wofi --show drun

# Sistema
bind = $mod SHIFT, Q, killactive
bind = $mod, BackSpace, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod SHIFT, F, togglefloating
bind = $mod, P, layoutmsg, togglepseudotile
bind = $mod, J, layoutmsg, togglesplit

# Captura de pantalla
bind = , Print, exec, grim ~/Imágenes/captura-$(date +%Y%m%d-%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Imágenes/captura-$(date +%Y%m%d-%H%M%S).png
bind = $mod, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = , Shift_R, exec, grim -g "$(slurp)" ~/Imágenes/captura-$(date +%Y%m%d-%H%M%S).png
bind = $mod, Q, exec, ~/.config/hypr/scripts/whisper-toggle.sh

# Volumen
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brillo
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Bloqueo
bind = $mod, L, exec, hyprlock

# Foco entre ventanas
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Mover ventanas
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Redimensionar ventanas
binde = $mod CTRL, right, resizeactive, 50 0
binde = $mod CTRL, left, resizeactive, -50 0
binde = $mod CTRL, up, resizeactive, 0 -50
binde = $mod CTRL, down, resizeactive, 0 50

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

# Mover ventana al workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mover ventana flotante con ratón
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

##################
### REGLAS ###
##################
windowrule[class:.*] = suppressevent maximize
windowrule[class:^(pavucontrol)$] = float
windowrule[class:^(nm-connection-editor)$] = float
windowrule[title:^(Preferencias)$] = float
windowrule[class:^(kitty)$] = opacity 0.9 0.85
windowrule[title:^(spotify-popup)$] = float
windowrule[title:^(spotify-popup)$] = center
windowrule[title:^(spotify-popup)$] = size 320 220
windowrule[title:^(spotify-popup)$] = noblur
windowrule[title:^(spotify-popup)$] = noshadow
